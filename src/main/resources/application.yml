spring:
  application:
    name: argus-webapi
  # Read as properties from the working directory. Not Docker's env_file:, which
  # injects env vars; this one needs the file on disk.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # Keeps framework messages (Bean Validation above all) in English regardless of
  # the host locale, instead of following Accept-Language.
  web:
    locale: en
    locale-resolver: fixed
  flyway:
    enabled: true
    # Brackets keep the keys literal. Without them Boot's binder normalises them to
    # kebab-case and they stop matching ${admin_email} in the migration.
    placeholders:
      "[admin_email]": ${ADMIN_EMAIL}
      "[admin_password_hash]": ${ADMIN_PASSWORD_HASH}

server:
  port: ${SERVER_PORT:8080}

argus:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    issuer: argus-webapi
    access-ttl: 15m
    refresh-ttl: 7d
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
  stream:
    heartbeat: 30s
    timeout: 1h

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
